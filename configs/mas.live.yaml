name: "mas-ltxv"
description: "Live with LTX-2.5 video+audio — Tolkien → Spielberg → LTX-2.5 render → ffplay"
graph: "mas_graph"
llm_backend: "openai"
model: "gpt-4.1"
temperature: 0.7
max_tokens_per_agent: 1024
context_window_history: 5
narrative_memory_target_tokens: 800

live: true
video_enabled: true
lead_clips: 0

# ── LTX-2.5 video backend ──────────────────────────────────────────
i2v_backend: "ltxv"
i2v_model: "ltx-2.5"
i2v_duration: 5                          # default seconds; Spielberg overrides per shot
i2v_seed_image: "data/legoman.png"

# Point this at the running LTX-2.5 server (server/ltx2_server.py).
ltxv_server_url: "http://localhost:8000"

# How hard each chunk holds the previous one, 0..1. This is the
# continuity-vs-steering knob (plan 04 finding): 1.0 maximises visual
# continuity but a new prompt barely lands; lower lets steering through.
ltxv_continuity_strength: 1.0
# Trailing frames of the previous chunk used as the condition.
ltxv_continuity_frames: 9

# ── Audio (off — LTX-2.5 generates ambient audio natively in the
#    video; Attenborough's spoken narration still needs ElevenLabs) ──
audio_enabled: false
min_pause_seconds: 3.0                   # ~2 clips of silence between commentary
