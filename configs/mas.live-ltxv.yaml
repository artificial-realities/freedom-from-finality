name: "mas-ltxv"
description: "Live with LTXV 13b video — Tolkien → Spielberg → LTXV render → ffplay"
graph: "mas_graph"
llm_backend: "openai"
model: "gpt-4.1"
temperature: 0.7
max_tokens_per_agent: 1024
context_window_history: 5
narrative_memory_target_tokens: 800

live: true
video_enabled: true
lead_clips: 0

# ── LTXV video backend ──────────────────────────────────────────────
i2v_backend: "ltxv"
i2v_model: "ltxv-13b-0.9.8-distilled"
i2v_duration: 1                          # ~1.37s actual (41 frames @ 30fps)
i2v_seed_image: "data/legoman.png"

# Point this at the running LTXV server (server/ltxv_server.py).
ltxv_server_url: "http://localhost:8000"
ltxv_anchor_strength: 0.5               # identity-hold sweet spot from plan 04

# ── Audio (off for MVP — enable separately) ─────────────────────────
audio_enabled: false
min_pause_seconds: 3.0                   # ~2 clips of silence between commentary
