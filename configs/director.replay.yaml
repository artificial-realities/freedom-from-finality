name: "director-replay"
description: "Director engine with replayed clips: the live loop and the web player with real video but no GPU"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
# The Director as in the live config (RUN-16); the Showrunner keeps `model`.
director_model: "gpt-5.4-mini"
director_reasoning_effort: "none"
temperature: 0.7
max_tokens_per_agent: 1024

live: true
video_enabled: true
startup_clips: 0

# ── Replay video backend ───────────────────────────────────────────
# Serves clips left by an earlier live run, in order, ignoring the prompt.
# Point it at any directory of *.mp4 files; `i2v_replay_delay` imitates
# render latency (seconds per clip).
i2v_backend: "replay"
i2v_replay_dir: "logs/video"
i2v_replay_delay: 3.0

narration: "ltx"
audio_enabled: false

recent_clips: 6
max_clips_per_beat: 4
scene_seconds: 240
compaction_interval: 10
showrunner_min_gap: 4
buffer_seconds: 4.7
stagnation_seconds: 90
