name: "director-ltxv"
description: "Director engine with LTX-2.5 video: Director → compiled prompt → LTX-2.5 render → ffplay; Showrunner async"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
temperature: 0.7
max_tokens_per_agent: 1024

live: true
video_enabled: true
# One clip rendered ahead of the one on air: a slow clip or a Director
# retry never reaches the screen while generation runs under real time.
# A viewer's line lands about three clips after it is typed (two with 0).
lead_clips: 1

# ── LTX-2.5 video backend ──────────────────────────────────────────
i2v_backend: "ltxv"
i2v_duration: 5                          # fallback seconds when no clip length is known
clip_seconds: 6                          # every clip is 6 s (145 frames): one shape to compile, 12-18 s steering latency
i2v_seed_image: "data/legoman.png"
ltxv_server_url: "http://localhost:8000"
ltxv_continuity_strength: 1.0
ltxv_continuity_frames: 9
# Identity anchor: the reference image as a guiding keyframe at the end of
# every clip. Off: the 2026-09-15 sweep showed identity holds without it on
# the distilled recipe, and an end anchor suppresses the closing action.
ltxv_anchor_strength: 0.0
ltxv_anchor_index: -1
# Negative prompt from the 2026-09-08 sweep: removes the green-face artifact.
ltxv_negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted, green skin, green face, glowing, neon, coloured light, spotlight, lens flare, grey background, dark background, textured floor, hair, eyebrows, extra characters, text, watermark"

# ── Narration ──────────────────────────────────────────────────────
# LTX-2.5 renders the voice-over natively from the compiled prompt. Set
# narration: "tts" plus audio_enabled/elevenlabs_voice_id for a fixed voice.
narration: "ltx"
audio_enabled: false
min_pause_seconds: 15.0

recent_beats: 4
max_shots_per_segment: 3
max_segments_per_scene: 12
compaction_interval: 10
stagnation_threshold: 5
