name: "director-ltxv"
description: "Director engine with LTX-2.5 video: Director → compiled prompt → LTX-2.5 render → ffplay; Showrunner async"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
# The Director call is the per-clip critical path. With luna at standard
# tier, priority is not needed (luna's output is shorter than gpt-5.4-mini's).
director_service_tier: ""
# Both roles are gpt-5.6-luna at no reasoning. Luna beat gpt-5.4-mini as
# Director under both judges (win share 0.62/0.55) and produced the best
# films (0.75 vs control); as Showrunner it won 22/22 vs gpt-4.1.
# Cost: $0.50/film-hour (was $3.88 with gpt-5.4-mini priority + gpt-4.1).
director_model: "gpt-5.6-luna"
showrunner_model: "gpt-5.6-luna"
showrunner_reasoning_effort: "none"
director_reasoning_effort: "none"
temperature: 0.7
max_tokens_per_agent: 1024

live: true
video_enabled: true
# Startup only: two clips are queued before playback starts, and the queue
# holds two. Afterwards the just-in-time schedule keeps `buffer_seconds`
# (below), so this does not change where a viewer's line lands (two or
# three clips after it is typed, by arrival time).
startup_clips: 1

# ── LTX-2.5 video backend ──────────────────────────────────────────
i2v_backend: "ltxv"
clip_seconds: 6                          # the one clip shape: 145 frames at 24 fps (6.04 s on air); the server warms it
ltxv_server_url: "http://localhost:8000"
ltxv_continuity_strength: 1.0
ltxv_continuity_frames: 9
# The overlap seam: the server renders 153 frames (144 new + the 9 repeated), the page cuts where
# the repeat begins and crossfades the sound over it, and the server keeps each clip under -18 LUFS with its audio padded to
# the video. vast_run.sh reads both lines (the warm shape and the ceiling). `seam: "fade"` and no
# ceiling is the way back (145 frames).
seam: "overlap"
audio_ceiling_lufs: -18
# One standard size, 512x288 (the server's default), and the
# story's reference at its aspect to the pixel, resized whole; any other
# reference refuses to start instead of being cropped or padded.
i2v_reference_fit: "strict"
# Identity anchor: the reference image as a guiding keyframe at the end of
# every clip. Off: identity holds without it on the distilled recipe, and an
# end anchor suppresses the closing action.
ltxv_anchor_strength: 0.0
ltxv_anchor_index: -1

recent_clips: 6
max_clips_per_beat: 4
scene_seconds: 240
compaction_interval: 10
showrunner_min_gap: 4
buffer_seconds: 4.7                      # steady state: each clip is ready about this long before it plays
