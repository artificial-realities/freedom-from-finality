name: "director-ltxv"
description: "Director engine with LTX-2.5 video: Director → compiled prompt → LTX-2.5 render → ffplay; Showrunner async"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
# The Director call is the per-clip critical path. OpenAI's priority tier ran
# gpt-4.1 at ~150 tokens/s instead of ~60 on 2026-09-17 (2.1 s instead of
# 5.8 s per segment, same output) at a higher per-token price.
director_service_tier: "priority"
temperature: 0.7
max_tokens_per_agent: 1024

live: true
video_enabled: true
# Startup lead: two clips are queued before playback starts, and the queue
# holds two. The just-in-time schedule keeps its own buffer afterwards, so
# this does not change where a viewer's line lands (two or three clips
# after it is typed, by arrival time).
lead_clips: 1

# ── LTX-2.5 video backend ──────────────────────────────────────────
i2v_backend: "ltxv"
clip_seconds: 6                          # the one clip shape: 145 frames at 24 fps (6.04 s on air); the server warms it
ltxv_server_url: "http://localhost:8000"
ltxv_continuity_strength: 1.0
ltxv_continuity_frames: 9
# Identity anchor: the reference image as a guiding keyframe at the end of
# every clip. Off: the 2026-09-15 sweep showed identity holds without it on
# the distilled recipe, and an end anchor suppresses the closing action.
ltxv_anchor_strength: 0.0
ltxv_anchor_index: -1

# ── Narration ──────────────────────────────────────────────────────
# LTX-2.5 renders the voice-over natively from the compiled prompt, in the
# voice the story's narrator describes. narration: "tts" plus
# audio_enabled/elevenlabs_voice_id renders it through ElevenLabs instead.
narration: "ltx"
audio_enabled: false

recent_clips: 6
max_clips_per_beat: 4
scene_seconds: 240
compaction_interval: 10
showrunner_min_gap: 4
render_slack_seconds: 3.0
stagnation_seconds: 90
