name: "director"
description: "Director engine, headless: one Director call per segment, Showrunner on a slow clock, typed world model"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
# The Director as in the live config (RUN-16); the Showrunner keeps `model`.
director_model: "gpt-5.4-mini"
director_reasoning_effort: "none"
temperature: 0.7
max_tokens_per_agent: 1024

video_enabled: false

recent_clips: 6
max_clips_per_beat: 4
scene_seconds: 240
compaction_interval: 10
showrunner_min_gap: 4
buffer_seconds: 4.7
stagnation_seconds: 90
