name: "director"
description: "Director engine, headless: one Director call per segment, Showrunner on a slow clock, typed world model"
graph: "director"
llm_backend: "openai"
model: "gpt-4.1"
temperature: 0.7
max_tokens_per_agent: 1024

video_enabled: false
audio_enabled: false

# Narration is a Director field behind a deterministic gate. "ltx" folds the
# line into the video prompt (native audio); "tts" uses ElevenLabs when
# audio_enabled; "off" removes narration from this film entirely.
narration: "ltx"
min_pause_seconds: 15.0              # story-seconds of silence before the floor reopens

recent_clips: 6
max_clips_per_beat: 4
scene_seconds: 240
compaction_interval: 10
showrunner_min_gap: 4
render_slack_seconds: 3.0
stagnation_seconds: 90
