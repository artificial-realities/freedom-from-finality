# Run Untitled Project in Docker:   docker compose up --build
# then open http://localhost:8765
#
# By default the film plays as text (configs/director.yaml), which needs only
# OPENAI_API_KEY in .env. For video, the app needs an LTX-2.5 server: set
# PLAY_CONFIG=configs/director.live.yaml and LTXV_SERVER_URL in .env, or run
# the server here too on a machine with an 80 GB NVIDIA GPU (the `gpu`
# profile). See docs/self-hosting.md.
services:
  app:
    build: .
    image: untitled-project
    # Your keys are read from .env at start-up (copy .env.example first).
    env_file: .env
    command: ["python", "main.py", "play", "--config", "${PLAY_CONFIG:-configs/director.yaml}",
              "--player", "web", "--host", "0.0.0.0"]
    ports:
      # Reachable from this computer only. The player has no login, and every
      # line typed into it costs a call billed to the configured OpenAI account.
      - "127.0.0.1:8765:8765"
    volumes:
      - logs:/app/logs
    extra_hosts:
      # A server tunnelled to this host's port 8000: LTXV_SERVER_URL=http://host.docker.internal:8000
      - "host.docker.internal:host-gateway"

  # The LTX-2.5 server, only with `--profile gpu`. Start it first and wait for
  # (healthy): the first start downloads ~72 GB of gated weights and warms the
  # clip shape, which takes 5-20 minutes or more.
  ltx-server:
    profiles: ["gpu"]
    build: server
    image: untitled-project-ltx
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      LTX2_API_KEY: ${LTX2_API_KEY:-}
      LTX2_HOST: 0.0.0.0  # inside the container only
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json, sys, urllib.request; sys.exit(json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] != 'ready')"]
      interval: 30s
      timeout: 10s
      start_period: 60m

volumes:
  logs:
  hf-cache:
