<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your story map</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #eee; --dim: #8d8d8d; --line: #3a3a3a; --card: #0d0d0d; --accent: #e8c26a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .banner { border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
  .banner.notice { border-color: #6b4b1f; background: #1e1508; }
  .banner a { color: var(--accent); }
  .banner[hidden] { display: none; }
  .chart { overflow-x: auto; overflow-y: hidden; border: 1px solid #1c1c1c; border-radius: 8px; background: #050505; }
  .chart svg { display: block; }
  .chart text { fill: var(--fg); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .chart .dim { fill: var(--dim); }
  .chart .lane-label { font-size: 13px; font-weight: 600; }
  .chart .lane-label.current { fill: var(--accent); }
  .chart .rail { stroke: var(--line); stroke-width: 2; fill: none; }
  .chart .rail.current { stroke: #6e5a2c; }
  .chart .node { cursor: pointer; outline: none; }
  .chart .node .frame { fill: #111; stroke: #2b2b2b; stroke-width: 1; }
  .chart .node:hover .frame, .chart .node:focus-visible .frame { stroke: #777; }
  .chart .node.selected .frame { stroke: var(--accent); stroke-width: 2; }
  .chart .dot { fill: var(--fg); stroke: var(--bg); stroke-width: 2; }
  .chart .dot.head { fill: var(--bg); stroke: var(--accent); stroke-width: 3; }
  .chart .dot.origin { fill: var(--accent); }
  .chart .landmark { fill: none; stroke: var(--dim); stroke-width: 1.5; }
  .panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  @media (min-width: 760px) { .panel { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); } }
  .panel img, .panel .blank { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #111; display: block; }
  .panel h2 { font-size: 19px; margin: 0 0 4px; }
  .panel .when { color: var(--dim); font-size: 14px; margin: 0 0 10px; }
  .panel p { margin: 0 0 10px; color: #d6d6d6; }
  .panel .label { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 4px; }
  button { padding: 8px 14px; font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Your story map</h1>
  <p class="sub">Everything your adventure has been, and every way it can go on. Nothing is lost: every timeline stays here.</p>
  <div class="banner notice" id="notice" hidden></div>
  <div class="banner" id="playing" hidden>Your story is playing. <a href="/film">Watch it</a></div>
  <div class="chart" id="chart"></div>
  <div class="panel" id="panel"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SVG = 'http://www.w3.org/2000/svg';
  // One column per moment on the map, in story order; one lane per timeline.
  const COL = 136, LANE = 168, LEFT = 24, TOP = 8, TW = 112, TH = 63;
  let data = null, status = { state: 'map', notice: '' }, selected = null, scrolled = false;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const svg = (tag, attrs, parent) => {
    const e = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const when = seg => {
    if (!seg) return 'The first frame';
    const min = Math.round(seg * data.clip_seconds / 60);
    const t = min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')} min`;
    return `${t} into the story · segment ${seg}`;
  };
  // A name in at most two short lines under its node.
  const wrap = (text, n = 19) => {
    const lines = [''];
    for (const w of String(text).split(/\s+/)) {
      const cur = lines[lines.length - 1];
      if ((cur + ' ' + w).trim().length <= n) lines[lines.length - 1] = (cur + ' ' + w).trim();
      else if (lines.length < 2) lines.push(w);
      else { lines[1] = (lines[1] + ' ' + w).slice(0, n - 1) + '…'; break; }
    }
    return lines;
  };

  function laneTitle(line, points) {
    if (line.id === 'root') return 'The first timeline';
    if (!line.parent) return 'Begun again from the first frame';
    const p = points[line.begins];
    return `Branch from “${p ? p.name : line.begins}”`;
  }

  // Each timeline below the one it branched from; the ones begun from the
  // first frame start their own trees, the first timeline first.
  function lanes() {
    const out = [], kids = {};
    for (const t of data.timelines) (kids[t.parent || ''] ||= []).push(t);
    const visit = t => {
      out.push(t);
      (kids[t.id] || []).sort((a, b) => a.forked_at - b.forked_at || a.created_at.localeCompare(b.created_at)).forEach(visit);
    };
    (kids[''] || []).forEach(visit);
    return out;
  }

  function nodes() {
    const points = Object.fromEntries([data.origin, ...data.points].map(p => [p.id, p]));
    const fresh = data.timelines.length === 1 && data.timelines[0].clips === 0;
    const order = lanes();
    const list = [{ kind: 'origin', id: 'origin', lane: 0, seg: 0, p: data.origin, fresh }];
    order.forEach((t, i) => {
      t.checkpoints.forEach(id => list.push({ kind: 'point', id, lane: i, seg: points[id].segment, p: points[id], t }));
      t.landmarks.forEach((m, j) => list.push({ kind: 'landmark', id: `${t.id}~${j}`, lane: i, seg: m.segment, p: m, t }));
      if (!(t.id === 'root' && t.clips === 0)) list.push({ kind: 'head', id: `head:${t.id}`, lane: i, seg: t.head.segment, p: t.head, t });
    });
    // Two moments of one lane at the same segment (a latest position on its
    // last checkpoint) each get a column of their own, the head after.
    const taken = {};
    for (const n of list.sort((a, b) => a.seg - b.seg || (a.kind === 'head') - (b.kind === 'head'))) {
      const key = `${n.lane}:${n.seg}`;
      n.slot = taken[key] || 0;
      taken[key] = n.slot + 1;
    }
    const keys = [...new Set(list.map(n => n.seg * 4 + n.slot).concat(order.map(t => t.forked_at * 4)))].sort((a, b) => a - b);
    const col = Object.fromEntries(keys.map((k, i) => [k, i]));
    for (const n of list) {
      n.x = LEFT + TW / 2 + col[n.seg * 4 + n.slot] * COL;
      n.y = TOP + n.lane * LANE + 104;
    }
    return { list, order, points, width: LEFT * 2 + TW + keys.length * COL };
  }

  function draw() {
    const { list, order, points, width } = nodes();
    const height = TOP + order.length * LANE;
    const root = svg('svg', { width, height, role: 'group', 'aria-label': 'Your adventure as a branching timeline' });
    const byLane = i => list.filter(n => n.lane === i);
    const origin = list.find(n => n.kind === 'origin');

    order.forEach((t, i) => {
      const own = byLane(i), y = TOP + i * LANE + 104, cur = t.id === data.current;
      const start = list.find(n => n.id === t.begins) || origin;
      const x0 = start.x;
      const x1 = Math.max(x0, ...own.map(n => n.x));
      if (i > 0) {
        // The branch leaves the moment it began from, on its parent's lane (or the origin).
        svg('path', { class: 'rail' + (cur ? ' current' : ''), d: `M${x0} ${start.y + 8} V${y - 14} Q${x0} ${y} ${x0 + 14} ${y} H${x1}` }, root);
      } else {
        svg('path', { class: 'rail' + (cur ? ' current' : ''), d: `M${x0} ${y} H${x1}` }, root);
      }
      const label = svg('text', { class: 'lane-label' + (cur ? ' current' : ''), x: i ? x0 + 20 : LEFT, y: TOP + i * LANE + 14 }, root);
      label.textContent = laneTitle(t, points) + (cur ? ' · last played' : '') + (t.clips ? ` · ${t.clips} clips` : ' · not played yet');
    });

    for (const n of list) {
      const g = svg('g', { class: 'node' + (n.id === selected ? ' selected' : ''), tabindex: 0, role: 'button',
                           'aria-label': `${n.kind === 'head' ? 'Latest position' : n.p.name || 'Frame zero'}, ${when(n.seg)}` }, root);
      g.addEventListener('click', () => select(n.id));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n.id, true); } });
      if (n.kind === 'landmark') {
        svg('path', { class: 'landmark', d: `M${n.x} ${n.y - 7} l7 7 l-7 7 l-7 -7 z` }, g);
        wrap(n.p.name).forEach((s, k) => { const t = svg('text', { class: 'dim', x: n.x, y: n.y + 24 + k * 15, 'text-anchor': 'middle' }, g); t.textContent = s; });
        continue;
      }
      const top = n.y - 16 - TH;
      svg('rect', { class: 'frame', x: n.x - TW / 2 - 2, y: top - 2, width: TW + 4, height: TH + 4, rx: 5 }, g);
      if (n.p.still) {
        const clip = `c${n.id.replace(/[^a-z0-9]/gi, '_')}`;
        svg('rect', { x: n.x - TW / 2, y: top, width: TW, height: TH, rx: 4 }, svg('clipPath', { id: clip }, g));
        svg('image', { href: n.p.still + (n.kind === 'head' ? `?s=${n.seg}` : ''), x: n.x - TW / 2, y: top, width: TW, height: TH,
                       preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#${clip})` }, g);
      }
      svg('circle', { class: 'dot ' + n.kind, cx: n.x, cy: n.y, r: n.kind === 'head' ? 7 : 6 }, g);
      const name = n.kind === 'head' ? ['Where it stands'] : n.kind === 'origin' ? ['Frame zero'] : wrap(n.p.name);
      name.forEach((s, k) => { const t = svg('text', { x: n.x, y: n.y + 24 + k * 15, 'text-anchor': 'middle' }, g); t.textContent = s; });
    }
    $('chart').replaceChildren(root);
    if (!scrolled) {
      // Open on where the viewer last was.
      const head = list.find(n => n.id === `head:${data.current}`);
      if (head) $('chart').scrollLeft = Math.max(0, head.x - $('chart').clientWidth + TW);
      scrolled = true;
    }
    return list;
  }

  function panel(n) {
    const box = $('panel');
    box.replaceChildren();
    if (!n) return;
    const pic = n.p.still ? Object.assign(el('img'), { src: n.p.still + (n.kind === 'head' ? `?s=${n.seg}` : ''), alt: '' }) : el('div', 'blank');
    const text = el('div');
    const title = { origin: 'Frame zero', head: 'Where it stands', point: n.p.name, landmark: n.p.name }[n.kind];
    text.appendChild(el('h2', '', title));
    text.appendChild(el('p', 'when', when(n.seg) + (n.p.place ? ` · ${n.p.place}` : '') + (n.p.on_screen && n.p.on_screen.length ? ` · ${n.p.on_screen.join(', ')}` : '')));
    if (n.kind === 'point') {
      text.appendChild(el('p', '', n.p.chronicle));
      text.appendChild(el('div', 'label', 'The moment'));
      text.appendChild(el('p', '', n.p.picture));
    } else if (n.kind === 'head') {
      if (n.p.picture) text.appendChild(el('p', '', n.p.picture));
      const last = n.t.stretches[n.t.stretches.length - 1];
      if (n.t.act || last) text.appendChild(el('div', 'label', 'Lately'));
      if (n.t.act) text.appendChild(el('p', '', n.t.act));
      else if (last) text.appendChild(el('p', '', last.text));
    } else if (n.kind === 'origin') {
      text.appendChild(el('p', '', n.p.picture));
    } else {
      text.appendChild(el('p', '', n.p.chronicle));
      text.appendChild(el('p', 'when', 'Then named this turning point after its moment was no longer kept: it marks the map, but the story cannot go back to it.'));
    }
    const act = {
      origin: () => n.fresh ? ['Begin', 'continue', { timeline: 'root' }] : ['Start over from here', 'branch', { checkpoint: 'origin' }],
      point: () => ['Take another way from here', 'branch', { checkpoint: n.id }],
      head: () => [n.t.clips ? 'Continue' : 'Begin', 'continue', { timeline: n.t.id }],
    }[n.kind]?.();
    if (act) {
      const b = el('button', '', act[0]);
      b.disabled = status.state !== 'map';
      b.addEventListener('click', () => go(act[1], act[2], b));
      text.appendChild(b);
      if (n.kind === 'point' || (n.kind === 'origin' && !n.fresh)) {
        text.appendChild(el('p', 'when', 'This begins a new timeline from this moment; the one you leave stays on the map.'));
      }
    }
    box.append(pic, text);
  }

  function select(id, focus) {
    selected = id;
    const list = draw();
    panel(list.find(n => n.id === id));
    if (focus) $('chart').querySelector('.node.selected').focus();
  }

  function render() {
    $('playing').hidden = status.state === 'map';
    $('notice').hidden = !status.notice;
    $('notice').textContent = status.notice || '';
    if (!data) return;
    const ids = new Set(nodes().list.map(n => n.id));
    if (!ids.has(selected)) selected = ids.has(`head:${data.current}`) ? `head:${data.current}` : 'origin';
    select(selected);
  }

  async function go(how, body, btn) {
    btn.disabled = true;
    try {
      const r = await fetch('/' + how, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      location.href = '/film';
    } catch (e) {
      status.notice = String(e.message || e);
      render();
    }
  }

  async function load() {
    try {
      const r = await fetch('/map.json', { cache: 'no-store' });
      data = await r.json();
    } catch (e) { status.notice = 'The map could not be read.'; }
    render();
  }

  const es = new EventSource('/events');
  es.addEventListener('hello', e => { status = JSON.parse(e.data).status || status; load(); });
  es.addEventListener('status', e => { status = JSON.parse(e.data); load(); });
  // While a film plays elsewhere, its latest position moves.
  setInterval(() => { if (status.state !== 'map') load(); }, 10000);
})();
</script>
</body>
</html>
