<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled Project</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #eee; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  main { width: min(100vw - 32px, (100vh - 112px) * 16 / 9); display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
  .screen video.on { opacity: 1; }
  .text { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 6% 10%; text-align: center; }
  .text.on { display: flex; }
  .text p { margin: 0 0 .7em; font-size: clamp(16px, 2vw, 24px); }
  .text .said { color: #aaa; font-style: italic; font-size: clamp(14px, 1.6vw, 20px); }
  .start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5); }
  .start[hidden] { display: none; }
  .start button { width: 72px; height: 72px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #000; font-size: 26px; padding-left: 6px; cursor: pointer; }
  .spinner { position: absolute; right: 14px; bottom: 14px; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, .25); border-top-color: #fff; border-radius: 50%; animation: spin .9s linear infinite; }
  .spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; color: #eee; background: #111; border: 1px solid #333; border-radius: 6px; outline: none; }
  input:focus { border-color: #666; }
  input:disabled { opacity: .5; }
</style>
</head>
<body>
<main>
  <div class="screen">
    <video id="vA" playsinline preload="auto"></video>
    <video id="vB" playsinline preload="auto"></video>
    <video id="vC" playsinline preload="auto"></video>
    <div class="text" id="text"></div>
    <div class="spinner" id="spinner" hidden></div>
    <div class="start" id="start"><button type="button" aria-label="Play">▶</button></div>
  </div>
  <form id="form"><input id="input" type="text" autocomplete="off" maxlength="400" placeholder="Suggest something…" aria-label="Suggest something"></form>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // Clip N+1's first `overlap_seconds` repeat clip N's tail. The picture
  // cuts from N to N+1 when N's media time reaches that point (N+1 starts
  // at its own head, the same picture); the sound crossfades with equal
  // power over the overlap, except that a clip with speech comes in at
  // once. Three elements, so a queued clip never evicts the one being
  // prefetched or the one still sounding.
  const pool = [$('vA'), $('vB'), $('vC')];
  let active = null;      // the element on screen
  let outgoing = null;    // the element whose sound is fading out
  let incoming = null;    // the element waiting to be cut to
  let cuts = 0;           // the latest cut: an older one still waiting is dropped
  const waiting = [];     // queued clips with no free element yet
  let armed = false;      // the viewer clicked: the page may play sound
  let skew = 0;           // Date.now()/1000 - server time
  let now = null;         // the item on air
  let ended = false;
  let stalled = false;    // the active video is waiting for data mid-clip
  const serverNow = () => Date.now() / 1000 - skew;
  pool.forEach(v => {
    v.addEventListener('waiting', () => { if (v === active) stalled = true; });
    ['playing', 'pause', 'ended'].forEach(ev => v.addEventListener(ev, () => { stalled = false; }));
  });

  // ── Video ──────────────────────────────────────────────────────
  const inUse = v => v === active || v === outgoing || v === incoming;
  const idle = v => !inUse(v) && v.dataset.queued !== '1';

  function load(v, item, queued) {
    v.src = item.url; v.dataset.url = item.url; v.dataset.turn = item.turn; v.dataset.queued = queued ? '1' : '';
    v.load();
  }

  function prefetch(item) {
    if (!item.url || pool.some(v => v.dataset.url === item.url)) return;
    const v = pool.find(idle);
    if (v) load(v, item, true); else waiting.push(item);
  }

  function releaseOutgoing() {
    if (outgoing) { outgoing.pause(); outgoing.dataset.queued = ''; outgoing = null; }
    while (waiting.length && pool.some(idle)) prefetch(waiting.shift());
  }

  function cutTo(item) {
    $('text').classList.remove('on');
    const cut = ++cuts;
    // The page fell a clip behind (a cut still waits for its moment): drop
    // that cut and come in on this clip from the server's clock.
    const behind = incoming !== null;
    if (behind) { incoming.pause(); incoming.dataset.queued = ''; incoming = null; }
    const cur = active;
    const same = cur && cur.dataset.url === item.url && cur.dataset.turn == item.turn;
    const v = same ? cur
      : pool.find(e => e.dataset.url === item.url && !inUse(e)) || pool.find(idle) || pool.find(e => !inUse(e));
    if (v !== cur) incoming = v;
    if (v.dataset.url !== item.url) load(v, item, false);
    v.dataset.turn = item.turn; v.dataset.queued = '';
    const overlap = item.overlap_seconds || 0;
    // The film's first clip, or one after a hold: in from the server's clock.
    const first = behind || !cur || cur === v || cur.paused || !isFinite(cur.duration);
    let shown = false;
    const show = () => {
      if (shown || v === cur || cut !== cuts) return;
      shown = true;
      const onFrame = () => {
        if (cut !== cuts) return;
        if (incoming === v) incoming = null;
        v.classList.add('on');
        if (cur) cur.classList.remove('on');
        if (outgoing && outgoing !== cur) releaseOutgoing();
        outgoing = first ? null : cur;
        active = v;
        if (first) { fade(v, 0, 1, 150); if (cur) cur.pause(); }
        else crossfade(cur, v, Math.max(0.05, overlap), !!item.speech);
      };
      // A paused element (the browser refused to play before the viewer's
      // click) presents no new frame: show it now, and the click plays it.
      if (v.requestVideoFrameCallback && !v.paused) v.requestVideoFrameCallback(onFrame); else onFrame();
    };
    const start = () => {
      if (cut !== cuts) return;
      try {
        if (first) {
          const offset = Math.max(0, serverNow() - item.started_at);
          if (offset > 0.3 && offset < (v.duration || item.duration) - 0.15) v.currentTime = offset;
        } else {
          // In step with the outgoing clip: its time past the cut point.
          const past = Math.max(0, cur.currentTime - Math.max(0, cur.duration - overlap));
          if (past > 0.02) v.currentTime = past;
        }
      } catch (e) {}
      v.play().then(show).catch(() => { if (!armed) $('start').hidden = false; show(); });
    };
    // Cut when the outgoing clip reaches the overlap (by its media time), or now.
    const at = first ? 0 : Math.max(0, cur.duration - overlap);
    const ready = () => {
      if (first || cur.currentTime >= at - 0.021) { start(); return; }
      if (cur.requestVideoFrameCallback) cur.requestVideoFrameCallback((_n, meta) => (meta.mediaTime >= at - 0.021 ? start() : ready()));
      else requestAnimationFrame(ready);
    };
    if (v.readyState >= 1) ready(); else v.addEventListener('loadedmetadata', ready, { once: true });
  }

  function crossfade(out, inc, seconds, speech) {
    const t0 = performance.now(), ms = seconds * 1000;
    try { inc.volume = speech ? 1 : 0; } catch (e) {}
    const step = t => {
      const f = Math.min(1, (t - t0) / ms);
      try { out.volume = Math.cos(f * Math.PI / 2); } catch (e) {}
      if (!speech) try { inc.volume = Math.sin(f * Math.PI / 2); } catch (e) {}
      if (f < 1) requestAnimationFrame(step); else releaseOutgoing();
    };
    requestAnimationFrame(step);
  }

  function fade(el, from, to, ms) {
    const t0 = performance.now();
    const step = t => {
      const f = Math.min(1, (t - t0) / ms);
      try { el.volume = from + (to - from) * f; } catch (e) {}
      if (f < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ── Text (no video backend) ────────────────────────────────────
  function showText(item) {
    pool.forEach(v => { v.classList.remove('on'); v.pause(); });
    active = null;
    const box = $('text');
    box.replaceChildren();
    const p = document.createElement('p');
    p.textContent = item.narration || '';
    box.appendChild(p);
    (item.dialogue || []).forEach(line => {
      const said = document.createElement('p');
      said.className = 'said';
      said.textContent = line;
      box.appendChild(said);
    });
    box.classList.add('on');
  }

  function show(item) {
    now = item;
    if (item.url) cutTo(item); else showText(item);
  }

  // The spinner shows while the picture waits: before the first clip,
  // while the next clip is late (the clock ran past this one) or when the
  // video stalls.
  function tick() {
    const late = now && serverNow() - now.started_at >= now.duration;
    $('spinner').hidden = ended || !armed || !(late || stalled || !now);
    requestAnimationFrame(tick);
  }

  function finish() {
    ended = true;
    const input = $('input');
    input.disabled = true; input.value = ''; input.placeholder = 'The film has ended.';
    $('start').hidden = true;
  }

  // ── Events ─────────────────────────────────────────────────────
  const es = new EventSource('/events');
  es.addEventListener('hello', e => {
    const s = JSON.parse(e.data);
    skew = Date.now() / 1000 - s.server_time;
    s.queued.forEach(prefetch);
    if (s.now) show(s.now);
    if (s.ended) finish();
  });
  es.addEventListener('queued', e => prefetch(JSON.parse(e.data)));
  es.addEventListener('playing', e => show(JSON.parse(e.data)));
  es.addEventListener('ended', () => { finish(); es.close(); });

  // ── Input ──────────────────────────────────────────────────────
  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const input = $('input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      const r = await fetch('/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    } catch (e) {
      console.warn('input not sent:', e);
      if (!input.value) input.value = text;   // give the line back to try again
    }
  });

  $('start').addEventListener('click', () => {
    armed = true;
    $('start').hidden = true;
    if (active && active.paused && now && now.url) {
      // In where the film is now, by the server's clock.
      const offset = serverNow() - now.started_at;
      try { if (offset > 0.3 && offset < active.duration - 0.15) active.currentTime = offset; } catch (e) {}
      active.play().catch(() => {});
    }
    $('input').focus();
  });

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
