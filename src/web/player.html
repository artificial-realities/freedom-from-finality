<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artificial Realities</title>
<style>
  :root {
    --bg: #0a0a0c; --panel: #111115; --line: #1f1f26; --text: #e9e7e1; --muted: #8b8a94;
    --accent: #d9b46b; --ok: #7fb58a; --warn: #d9a35a; --bad: #c96b6b; --you: #8fb7e6;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  body { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  header h1 { font: 500 15px/1 var(--sans); letter-spacing: .04em; margin: 0; text-transform: uppercase; color: var(--text); }
  header .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-left: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(127,181,138,.18); }
  .dot.busy { background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
  .dot.ended { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  header .count { color: var(--muted); font-variant-numeric: tabular-nums; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 20px; gap: 12px; }
  .stage { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s ease; background: #000; }
  .stage video.active { opacity: 1; }
  .textstage { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 8% 12%; text-align: center; background: radial-gradient(ellipse at center, #17171c 0%, #0a0a0c 75%); }
  .textstage.active { display: flex; }
  .textstage .narration { font: 400 clamp(18px, 2.2vw, 28px)/1.4 var(--serif); color: var(--text); max-width: 34em; }
  .textstage .meta { margin-top: 22px; color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .pill.cut { color: var(--accent); border-color: rgba(217,180,107,.4); }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,10,12,.72); backdrop-filter: blur(2px); z-index: 5; }
  .overlay[hidden] { display: none; }
  .overlay button { font: 500 16px var(--sans); letter-spacing: .06em; color: var(--bg); background: var(--text); border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer; }
  .overlay button:hover { background: #fff; }
  .buffering { position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(10,10,12,.7); color: #fff; font: 500 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; z-index: 4; pointer-events: none; }
  .buffering[hidden] { display: none; }
  .buffering .ring { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 24px 16px; text-align: center; font: italic 400 clamp(14px, 1.4vw, 18px)/1.4 var(--serif); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9); background: linear-gradient(to top, rgba(0,0,0,.55), transparent); pointer-events: none; opacity: 0; transition: opacity .3s; }
  .caption.show { opacity: 1; }
  .progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
  .progress.held > div { background: var(--muted); }
  .under { display: flex; align-items: baseline; gap: 14px; color: var(--muted); font-size: 13px; min-height: 18px; }
  .under .scene { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .under .right { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .under .mute { color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; cursor: pointer; font: 12px var(--sans); }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font: 500 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 16px 20px 12px; }
  .script { flex: 1; overflow-y: auto; padding: 0 20px 12px; scroll-behavior: smooth; }
  .entry { padding: 12px 0; border-top: 1px solid var(--line); }
  .entry .head { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .entry .head .n { color: var(--text); font-weight: 500; }
  .entry .head .sc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .entry .head .tag { margin-left: auto; color: var(--accent); flex: none; }
  .entry.now .head .n { color: var(--accent); }
  .entry p { margin: 6px 0 0; font: 400 14px/1.5 var(--serif); color: var(--text); }
  .entry .vo { margin-top: 6px; color: var(--muted); font: italic 13px/1.45 var(--serif); }
  .entry .vo::before { content: "VO  "; font: 500 10px var(--sans); letter-spacing: .08em; color: var(--muted); font-style: normal; }
  .you { margin-top: 8px; padding: 8px 10px; border-radius: 4px; background: rgba(143,183,230,.08); border-left: 2px solid var(--you); font-size: 13px; }
  .you .line { color: var(--you); }
  .you .line::before { content: "you  "; font: 500 10px var(--sans); letter-spacing: .08em; color: var(--muted); }
  .you .disp { margin-top: 4px; color: var(--muted); }
  .you .disp b { font-weight: 500; }
  .you.pending .disp { color: var(--muted); font-style: italic; }
  .you .disp.absorbed b { color: var(--ok); }
  .you .disp.deferred b { color: var(--warn); }
  .you .disp.declined b { color: var(--bad); }
  form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  form input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: 14px var(--sans); outline: none; }
  form input:focus { border-color: #3a3a46; }
  form input::placeholder { color: #5d5c66; }
  form button { background: var(--text); color: var(--bg); border: 0; border-radius: 6px; padding: 0 14px; font: 500 13px var(--sans); cursor: pointer; }
  form button:disabled, form input:disabled { opacity: .4; cursor: default; }
  .hint { padding: 0 20px 14px; color: #5d5c66; font-size: 12px; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px minmax(0, 1fr) 42vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    main { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Artificial Realities</h1>
  <span class="count" id="count"></span>
  <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
</header>

<main>
  <div class="stage" id="stage">
    <video id="vA" playsinline preload="auto"></video>
    <video id="vB" playsinline preload="auto"></video>
    <div class="textstage" id="textstage">
      <div class="narration" id="tsNarration">The film has not started yet.</div>
      <div class="meta" id="tsMeta"></div>
    </div>
    <div class="caption" id="caption"></div>
    <div class="buffering" id="buffering" hidden><div class="ring"></div><span>buffering</span></div>
    <div class="overlay" id="overlay"><button id="watch">▶&nbsp; Watch</button></div>
  </div>
  <div class="progress" id="progress"><div></div></div>
  <div class="under">
    <span class="scene" id="scene"></span>
    <span class="right" id="clock"></span>
    <button class="mute" id="mute" type="button">sound on</button>
  </div>
</main>

<aside>
  <h2>Script</h2>
  <div class="script" id="script"></div>
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="Steer the story… (Enter to send)" maxlength="400">
    <button type="submit" id="send">Send</button>
  </form>
  <div class="hint">Your line reaches the Director when it writes the next segment. It will absorb it, defer it, or decline it and say why.</div>
</aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const videos = [$('vA'), $('vB')];
  let active = 0;                 // index of the visible video
  let armed = false;              // user gesture happened: we may play with sound
  let muted = false;
  let skew = 0;                   // Date.now()/1000 - server_time
  let now = null;                 // the item on air
  let ended = false;
  const entries = new Map();      // turn -> .entry element
  const pendingInputs = [];       // {text, el} not yet landed
  const serverNow = () => Date.now() / 1000 - skew;
  let stalled = false;            // the active video is waiting for data mid-clip
  videos.forEach(v => {
    v.addEventListener('waiting', () => { if (v.classList.contains('active')) stalled = true; });
    ['playing', 'pause', 'ended'].forEach(ev => v.addEventListener(ev, () => { stalled = false; }));
  });

  // ── Status ───────────────────────────────────────────────────────
  function setStatus(text, kind) {
    $('status').textContent = text;
    $('dot').className = 'dot ' + (kind || '');
  }

  // ── Playback ─────────────────────────────────────────────────────
  function showItem(item) {
    now = item;
    $('count').textContent = 'segment ' + item.turn;
    $('scene').textContent = item.scene || '';
    const cap = $('caption');
    cap.textContent = item.voiceover || '';
    cap.classList.toggle('show', !!item.voiceover);
    if (item.url) playVideo(item); else playText(item);
    markNow(item.turn);
    setStatus(item.url ? 'playing' : 'playing (text)', 'live');
  }

  function playVideo(item) {
    $('textstage').classList.remove('active');
    const offset = Math.max(0, serverNow() - item.started_at);
    const standby = videos[1 - active];
    const cur = videos[active];
    const v = (cur.dataset.url === item.url && cur.dataset.turn == item.turn) ? cur : standby;
    if (v.dataset.url !== item.url) { v.src = item.url; v.dataset.url = item.url; v.load(); }
    v.dataset.turn = item.turn;
    v.muted = muted;
    const seekAndPlay = () => {
      const dur = isFinite(v.duration) ? v.duration : item.duration;
      if (offset >= dur - 0.15) {        // joined after it finished: hold the last frame
        try { v.currentTime = Math.max(0, dur - 0.05); } catch (e) {}
        v.pause();
      } else {
        try { if (offset > 0.3) v.currentTime = offset; } catch (e) {}
        v.play().catch(() => { if (!armed) $('overlay').hidden = false; });
      }
    };
    if (v.readyState >= 1) seekAndPlay(); else v.addEventListener('loadedmetadata', seekAndPlay, { once: true });
    if (v !== cur) {
      v.classList.add('active');
      cur.classList.remove('active');
      setTimeout(() => { if (!cur.classList.contains('active')) cur.pause(); }, 300);
      active = 1 - active;
    }
  }

  function playText(item) {
    videos.forEach(v => { v.classList.remove('active'); v.pause(); });
    $('tsNarration').textContent = item.narration || '';
    const meta = $('tsMeta');
    meta.innerHTML = '';
    if (item.transition === 'cut') meta.appendChild(pill('cut', 'cut'));
    (item.on_screen || []).forEach(n => meta.appendChild(pill(n)));
    if (item.camera) meta.appendChild(pill(item.camera));
    $('textstage').classList.add('active');
  }

  function pill(text, cls) {
    const s = document.createElement('span');
    s.className = 'pill' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function prefetch(item) {
    if (!item.url) return;
    const standby = videos[1 - active];
    if (standby.dataset.url !== item.url && !standby.classList.contains('active')) {
      standby.src = item.url; standby.dataset.url = item.url; standby.dataset.turn = item.turn; standby.load();
    }
  }

  // Progress bar + clock follow the server's clock.
  function tick() {
    const bar = $('progress');
    if (now) {
      const t = serverNow() - now.started_at;
      const f = Math.min(1, Math.max(0, t / now.duration));
      bar.firstElementChild.style.width = (f * 100).toFixed(1) + '%';
      bar.classList.toggle('held', f >= 1);
      // The next clip is late (the clock ran past this one) or the video stalled:
      // the last frame stays up with a buffering mark, like any player.
      $('buffering').hidden = !((f >= 1 && !ended) || stalled);
      $('clock').textContent = fmt(Math.min(t, now.duration)) + ' / ' + fmt(now.duration) + (f >= 1 && !ended ? '  ·  holding' : '');
    }
    requestAnimationFrame(tick);
  }
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // ── Script column ────────────────────────────────────────────────
  function entryFor(item) {
    let el = entries.get(item.turn);
    if (el) return el;
    el = document.createElement('div');
    el.className = 'entry';
    el.dataset.turn = item.turn;
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `<span class="n">#${item.turn}</span><span class="sc"></span>` +
      (item.transition === 'cut' ? `<span class="tag">cut</span>` : '');
    head.querySelector('.sc').textContent = item.scene || '';
    el.appendChild(head);
    if (item.user_input) {
      const you = document.createElement('div');
      you.className = 'you';
      you.innerHTML = `<div class="line"></div><div class="disp"></div>`;
      you.querySelector('.line').textContent = item.user_input;
      setDisposition(you, item.intervention, item.intervention_reason);
      el.appendChild(you);
    }
    const p = document.createElement('p');
    p.textContent = item.narration || '';
    el.appendChild(p);
    if (item.voiceover) {
      const vo = document.createElement('div');
      vo.className = 'vo';
      vo.textContent = item.voiceover;
      el.appendChild(vo);
    }
    // Insert in turn order (a reconnect can deliver history out of step).
    const list = $('script');
    const after = [...list.querySelectorAll('.entry')].find(e => +e.dataset.turn > item.turn);
    list.insertBefore(el, after || null);
    entries.set(item.turn, el);
    return el;
  }

  function setDisposition(you, disp, reason) {
    const d = you.querySelector('.disp');
    you.classList.remove('pending');
    d.className = 'disp ' + disp;
    if (disp === 'none' || !disp) { d.textContent = 'recorded; not acted on yet'; return; }
    d.innerHTML = `<b>${disp}</b>` + (reason ? ' — ' : '');
    if (reason) d.appendChild(document.createTextNode(reason));
  }

  function markNow(turn) {
    entries.forEach((el, t) => el.classList.toggle('now', t === turn));
    const el = entries.get(turn);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  // A line the viewer just sent, shown before the segment that carries it exists.
  function addPendingInput(rec) {
    if (pendingInputs.some(p => p.received_at === rec.received_at)) return;
    const you = document.createElement('div');
    you.className = 'you pending';
    you.innerHTML = `<div class="line"></div><div class="disp">waiting for the next segment…</div>`;
    you.querySelector('.line').textContent = rec.text;
    const wrap = document.createElement('div');
    wrap.className = 'entry';
    wrap.dataset.turn = 1e9;
    wrap.appendChild(you);
    $('script').appendChild(wrap);
    wrap.scrollIntoView({ block: 'nearest' });
    pendingInputs.push({ ...rec, el: wrap });
  }

  // Once a segment with user_input plays, the pending cards it absorbed go away.
  function landInputs(item) {
    if (!item.user_input) return;
    for (let i = pendingInputs.length - 1; i >= 0; i--) {
      if (item.user_input.includes(pendingInputs[i].text)) {
        pendingInputs[i].el.remove();
        pendingInputs.splice(i, 1);
      }
    }
  }

  // ── Events ───────────────────────────────────────────────────────
  function connect() {
    const es = new EventSource('/events');
    es.addEventListener('hello', e => {
      const s = JSON.parse(e.data);
      skew = Date.now() / 1000 - s.server_time;
      if (s.title) { $('title').textContent = s.title; document.title = s.title + ' — Artificial Realities'; }
      ended = s.ended;
      s.history.forEach(entryFor);
      s.inputs.filter(r => r.after_turn >= (s.history.length ? s.history[s.history.length - 1].turn : 0)).forEach(addPendingInput);
      s.queued.forEach(prefetch);
      if (s.now) { showItem(s.now); landInputs(s.now); }
      else if (!ended) setStatus(s.status || 'waiting for the first segment…', 'busy');
      if (ended) finish(s.history.length);
      else if (s.status && !s.now) setStatus(s.status, 'busy');
    });
    es.addEventListener('queued', e => prefetch(JSON.parse(e.data)));
    es.addEventListener('playing', e => { const item = JSON.parse(e.data); entryFor(item); landInputs(item); showItem(item); });
    es.addEventListener('input', e => addPendingInput(JSON.parse(e.data)));
    es.addEventListener('status', e => { const s = JSON.parse(e.data); if (!now || serverNow() - now.started_at >= now.duration) setStatus(s.text, 'busy'); });
    es.addEventListener('ended', e => { finish(JSON.parse(e.data).segments); es.close(); });
    es.onerror = () => { if (!ended) setStatus('reconnecting…', ''); };
  }

  function finish(n) {
    ended = true;
    setStatus('the film has ended after ' + n + ' segments', 'ended');
    $('input').disabled = true; $('send').disabled = true;
    $('overlay').hidden = true;
  }

  // ── Input ────────────────────────────────────────────────────────
  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const input = $('input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      const r = await fetch('/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!r.ok) { const err = await r.json().catch(() => ({})); setStatus(err.error || 'input rejected', 'ended'); }
    } catch (e) { setStatus('could not reach the server', 'ended'); }
    input.focus();
  });

  $('watch').addEventListener('click', () => {
    armed = true;
    $('overlay').hidden = true;
    const v = videos[active];
    if (now && now.url && v.classList.contains('active')) v.play().catch(() => {});
    $('input').focus();
  });
  $('mute').addEventListener('click', () => {
    muted = !muted;
    videos.forEach(v => v.muted = muted);
    $('mute').textContent = muted ? 'sound off' : 'sound on';
  });

  connect();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
