name: CI

# Offline only: no keys, no GPU, no paid calls.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg (the video tests make and join small clips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
